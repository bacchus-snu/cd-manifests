---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sgs-lecture-priority
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: set-lecture-priority
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
              namespaceSelector:
                matchLabels:
                  sgs.snucse.org/priority-class: lecture-priority
      mutate:
        patchStrategicMerge:
          spec:
            priorityClassName: lecture-priority
            priority: 1000
