---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: default
  name: atrium-bootstrap
---
apiVersion: v1
kind: Secret
metadata:
  namespace: default
  name: atrium-bootstrap
  annotations:
    kubernetes.io/service-account.name: atrium-bootstrap
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atrium-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: atrium-bootstrap
    namespace: default
