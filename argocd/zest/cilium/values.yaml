ipam:
  mode: kubernetes

kubeProxyReplacement: true
k8sServiceHost: zest.snucse.org
k8sServicePort: 6443

MTU: 1500

encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true
  wireguard:
    persistentKeepalive: 25s

bpf:
  masquerade: true

operator:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    maxUnavailable: null
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
