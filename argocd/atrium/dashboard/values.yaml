prometheus:
  prometheusSpec:
    externalUrl: https://dashboard.bacchus.io/prometheus
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi
    retention: 30d

alertmanager:
  enableFeatures:
    - auto-gomemlimit
  alertmanagerSpec:
    externalUrl: https://dashboard.bacchus.io/alertmanager
    alertmanagerConfigSelector:
      matchLabels:
        release: dashboard
    alertmanagerConfigMatcherStrategy:
      type: None
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOncePod
          resources:
            requests:
              storage: 10Gi

grafana:
  imageRenderer:
    grafanaProtocol: https

  grafana.ini:
    server:
      domain: dashboard.bacchus.io
      root_url: "https://%(domain)s"

    auth:
      disable_login_form: true

    auth.generic_oauth:
      enabled: true
      allow_sign_up: true
      client_id: BKeUDyfNhHIsXJbc8M6DXfQbDXRG01Er
      client_secret: "$__file{/etc/secrets/oidc-auth/secret}"
      scopes: openid email profile
      api_url: https://dev-1p1l3bz6kxwkga5k.us.auth0.com/userinfo
      auth_url: https://dev-1p1l3bz6kxwkga5k.us.auth0.com/authorize
      token_url: https://dev-1p1l3bz6kxwkga5k.us.auth0.com/oauth/token
      role_attribute_path: >
        contains("https://bacchus.io/groups"[*], 'regular-members@bacchus.snucse.org') && 'Editor' ||
        contains("https://bacchus.io/groups"[*], 'alumni-members@bacchus.snucse.org') && 'Viewer'

    security:
      disable_initial_admin_creation: true

  extraSecretMounts:
    - name: oidc-auth
      secretName: oidc-auth
      mountPath: /etc/secrets/oidc-auth
      readOnly: true

# Not available, we use cilium kube-proxy replacement
kubeProxy:
  enabled: false

# Talos binds these services to localhost.
# We could update the Talos config to allow scraping metrics.
kubeScheduler:
  enabled: false
  #service:
  #  selector:
  #    k8s-app: kube-scheduler
kubeControllerManager:
  enabled: false
