# avoid conflicting with the cluster monitoring stack
rbac:
  namespaced: true

env:
  GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: 'true'

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-operated.bacchus-sgs.svc.cluster.local:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 1m

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        disableDeletion: true
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/default
      - name: configmap
        disableDeletion: true
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/configmap

dashboards:
  default:
    node-exporter:
      gnetId: 1860
      revision: 37
      datasource: Prometheus

dashboardsConfigMaps:
  configmap: bacchus-sgs-dashboards

grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false

  server:
    domain: sgs-dashboard.snucse.org
    root_url: https://%(domain)s

  # auth
  auth:
    disable_login_form: true
  auth.anonymous:
    enabled: true
  auth.generic_oauth:
    enabled: true
    allow_sign_up: true
    client_id: sZxN8QtYpE24IxwAdYTpM4HwxZTgOQYW
    client_secret: '$__file{/etc/secrets/oidc-auth/secret}'
    scopes: openid email profile
    api_url: https://dev-1p1l3bz6kxwkga5k.us.auth0.com/userinfo
    auth_url: https://dev-1p1l3bz6kxwkga5k.us.auth0.com/authorize
    token_url: https://dev-1p1l3bz6kxwkga5k.us.auth0.com/oauth/token
    role_attribute_path: >
      contains("https://bacchus.io/groups"[*], 'regular-members@bacchus.snucse.org') && 'Editor' ||
      contains("https://bacchus.io/groups"[*], 'alumni-members@bacchus.snucse.org') && 'Viewer'

extraSecretMounts:
  - name: oidc-auth
    secretName: bacchus-sgs-monitoring
    mountPath: /etc/secrets/oidc-auth
    readOnly: true
