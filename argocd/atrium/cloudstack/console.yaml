---
# Web console. The console proxy system VM serves noVNC over HTTPS on 443 and
# the VNC WebSocket over TLS on 8443 at its guest overlay address, with the
# certificate below, which the sync job uploads to CloudStack. The gateway
# terminates TLS for console.cloud.snucse.org on 443 and forwards page and
# WebSocket alike to the relay, which reaches the proxy through this
# selector-less Service, whose EndpointSlice the sync job keeps at the current
# proxy address, and verifies the proxy's certificate: the overlay crosses
# networks that are not trusted. The gateway itself cannot reach the overlay
# (its proxy's upstream connections never arrive; cause not pinned down), so
# the routes point at a relay pod in front of this Service.
apiVersion: v1
kind: Service
metadata:
  name: console-proxy
spec:
  ports:
    - name: https
      port: 443
    - name: websocket
      port: 8443
---
# the name only has to verify on the relay's side; it needs no DNS record
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: console-proxy-tls
spec:
  secretName: console-proxy-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  # CloudStack takes RSA keys in PKCS#8 only
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS8
    rotationPolicy: Always
  dnsNames:
    - console-proxy.cloud.snucse.org
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudstack-management
      app.kubernetes.io/instance: cloudstack
      app.kubernetes.io/component: console-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/component: console-relay
    spec:
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
      containers:
        - name: relay
          image: nginx # replaced by kustomize
          ports:
            - name: http
              containerPort: 8081
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx
          configMap:
            name: console-relay
            items:
              - key: console-relay.conf
                path: default.conf
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: console-relay
spec:
  selector:
    app.kubernetes.io/name: cloudstack-management
    app.kubernetes.io/instance: cloudstack
    app.kubernetes.io/component: console-relay
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console-proxy
spec:
  parentRefs:
    - namespace: cilium-system
      name: web-gateway
      sectionName: https-cloud-snucse-org
  hostnames:
    - console.cloud.snucse.org
  rules:
    - backendRefs:
        - name: console-relay
          port: 80
