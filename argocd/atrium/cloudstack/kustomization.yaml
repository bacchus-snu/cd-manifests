resources:
  - mysql.yaml
  - resources.yaml
  - management.yaml
  - overlay-gw.yaml
  - console.yaml
  - sync.yaml
  - warpgate.yaml
  - gate.yaml
  - backup.yaml

labels:
  - pairs:
      app.kubernetes.io/name: cloudstack-management
      app.kubernetes.io/instance: cloudstack
    # selectors are written out explicitly: the console proxy Service must stay
    # selector-less because the sync job manages its endpoints
    includeTemplates: true

configMapGenerator:
  - name: cloudstack-sync
    files:
      - settings.toml
      - sync.py
      - templates.toml
      - roles.toml
      - idps.toml
  - name: warpgate-config
    files:
      - warpgate-config.yaml
  - name: warpgate-nginx
    files:
      - warpgate-nginx.conf
  - name: console-relay
    files:
      - console-relay.conf
  # the doors (provider, admitting group, domain, role) are in gate.toml
  - name: cloudstack-gate
    files:
      - gate.py
      - gate.toml
  - name: gate-config
    literals:
      - EXTERNAL_URL=https://cloud.snucse.org/gate
      - DOCS_URL=https://docs.cloud.snucse.org/
      # the bastion reaches instances through the overlay gateway, which
      # masquerades to its guest overlay address (overlay-gw.yaml)
      - SSH_SOURCE_CIDR=10.94.0.254/32
      - CONTACT=Bacchus
  # overlay gateway (overlay-gw.yaml); generated so that a change rolls the
  # DaemonSet. peers: hypervisor campus addresses, their VTEPs (generated from
  # the host inventory by cloudstack/hosts/render.yaml); overlays: vni
  # address/prefix; management-address: the management server as the hosts see
  # it ("host" global setting, agent.properties); management-gateway: pod
  # gateway of the management overlay, routed to the Internet only, never into
  # private networks
  - name: overlay-gw
    files:
      - peers=overlay-gw/peers
      - overlays=overlay-gw/overlays
    literals:
      - management-address=10.93.0.254
      - management-gateway=10.93.0.1/24
      - management-network=10.93.0.0/24
      - management-pod=cloudstack-management-0.cloudstack-management-pods.cloudstack.svc.cluster.local
  # UI branding and notices: the whole config.json is shipped, so diff it
  # against the upstream file again when the management image changes
  - name: cloudstack-ui
    files:
      - ui/config.json
      - ui/bacchus.png

images:
  - name: alpine
    newTag: '3.24'
  - name: python
    newTag: 3.15-alpine
  - name: warpgate
    newName: ghcr.io/warp-tech/warpgate
    newTag: 0.29.2
  - name: nginx
    newTag: 1.31-alpine
  - name: cloudstack-management
    newName: ghcr.io/bacchus-snu/cloud/management
    newTag: 4.23.0.100-snucse.1
