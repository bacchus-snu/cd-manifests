# CloudStack settings, kept by the sync job (sync.py: sync_settings) as the
# admin user, whose account has the built-in Root Admin role: only that role
# may change the settings that govern access control. A setting is written
# only where its value differs. A key the running management server does not
# know yet is skipped; a changed key that is not dynamic is logged as
# "restart required: <key>" and applies from the management server's next
# start. A failing entry fails the run once the others are applied.
#
# Each [[setting]] has a key and either value (a string, number or boolean)
# or value_env, the variable of the job's environment that holds the value (a
# Vault secret, sync.yaml; never printed). Its scope is global (the default),
# zone, cluster, storagepool, domain or account; any scope but global names
# its target: the zone, cluster, storage pool or account name, the domain path
# (ROOT/snucse), or * for every one of them.
#
# resource.limit.host.tags is not set here: the job writes it from
# compute-catalog.json, the CPU-only offering's tag and then every GPU type's.

# New accounts

# The account defaults: every account's limits until a quota grant raises
# them, read again by every quota recompute. 0 before launch; GPUs come by
# grant only; the snapshot count is unlimited, as the storage quota bounds
# what snapshots hold.
[[setting]]
key = "max.account.cpus"
value = 0

[[setting]]
key = "max.account.memory"
value = 0

[[setting]]
key = "max.account.gpus"
value = 0

[[setting]]
key = "max.account.user.vms"
value = 0

[[setting]]
key = "max.account.volumes"
value = 0

[[setting]]
key = "max.account.primary.storage"
value = 0

[[setting]]
key = "max.account.secondary.storage"
value = 0

[[setting]]
key = "max.account.snapshots"
value = -1

[[setting]]
key = "max.account.templates"
value = 0

[[setting]]
key = "max.account.networks"
value = 0

[[setting]]
key = "max.account.vpcs"
value = 0

[[setting]]
key = "max.account.public.ips"
value = 0

[[setting]]
key = "max.account.projects"
value = 0

[[setting]]
key = "max.account.backups"
value = 0

[[setting]]
key = "max.account.backup.storage"
value = 0

[[setting]]
key = "max.account.buckets"
value = 0

[[setting]]
key = "max.account.object.storage"
value = 0

# every new default security group: SSH from the bastion, which reaches
# instances from the overlay gateway's guest address, and all traffic within
# the account's own group
[[setting]]
key = "network.securitygroups.default.ingress.rules"
value = '[{"protocol":"tcp","startport":22,"endport":22,"cidrlist":["10.94.0.254/32"]},{"protocol":"all","owngroup":true}]'

# Quota requests and grants

# A start or a lease renewal is refused while the account is over its quota.
# Every grant has an end date, which ends at 23:59:59 in this time zone;
# warnings 7 and 1 days before it; the expiry sweep runs hourly. 0 days: the
# request form proposes no date, and no date is too late.
[[setting]]
key = "resource.request.enforce.quota"
value = true

[[setting]]
key = "resource.request.expiry.required"
value = true

[[setting]]
key = "resource.request.expiry.default.days"
value = 0

[[setting]]
key = "resource.request.expiry.max.days"
value = 0

[[setting]]
key = "resource.request.expiry.timezone"
value = "Asia/Seoul"

[[setting]]
key = "resource.request.expiry.warning.days"
value = "7,1"

[[setting]]
key = "resource.request.expiry.check.interval"
value = 3600

# Sign-in

# the session cookie is marked Secure, so a browser never returns it over plain HTTP (read at start)
[[setting]]
key = "enable.secure.session.cookie"
value = true

# the providers' membership check, hourly
[[setting]]
key = "oidc.reconcile.interval"
value = 3600

# Sign-in through the OpenID providers (idps.toml). While it is set, the
# password sign-in of an account that awaits adoption is refused before it
# counts, so the lockout below cannot disable one. To empty it, set the
# lockout to 0 first and restart the management server, which reads the
# lockout at start.
[[setting]]
key = "oidc.client.url"
value = "https://cloud.snucse.org/client"

[[setting]]
key = "incorrect.login.attempts.allowed"
value = 5

# What users are offered

# not offered (read at start)
[[setting]]
key = "cloud.kubernetes.service.enabled"
value = false

[[setting]]
key = "sharedfs.feature.enabled"
value = false

[[setting]]
key = "vnf.template.appliance.enabled"
value = false

# users stop their instances without the forced option
[[setting]]
key = "allow.user.force.stop.vm"
value = false

# users create no public templates
[[setting]]
key = "allow.public.user.templates"
value = false

# Product name

# in password reset mail and the SAML metadata, as the UI names the product
[[setting]]
key = "user.password.reset.mail.template"
value = "Hello {{username}}!\nYou have requested to reset your password. Please click the following link to reset your password:\n{{{resetLink}}}\nIf you did not request a password reset, please ignore this email.\n\nRegards,\nThe SNUCSE Cloud Team"

[[setting]]
key = "saml2.sp.org.name"
value = "SNUCSE Cloud"

# Placement and capacity

# CPU-only instances fill the most loaded host first, CPU and memory load
# weighed alike; GPU instances take the host and GPU group that fit best
[[setting]]
key = "vm.allocation.algorithm"
value = "firstfitmostconsumed"

[[setting]]
key = "host.capacityType.to.order.clusters"
value = "COMBINED"

[[setting]]
key = "host.capacityType.to.order.clusters.cputomemoryweight"
value = 0.5

[[setting]]
key = "gpu.allocation.algorithm"
value = "bestfit"

# a CPU-only instance runs on whole cores: its vCPU count is a multiple of 2
[[setting]]
key = "vm.pool.vcpu.step"
value = 2

# a stopped instance releases its CPU, memory and GPUs at once (read at start)
[[setting]]
key = "capacity.skipcounting.hours"
value = 0

[[setting]]
key = "gpu.detach.on.stop"
value = true

[[setting]]
key = "gpu.detach.on.stop"
scope = "domain"
target = "*"
value = true

# no CPU or memory overcommit; each host's own admission decides, never a
# cluster's load
[[setting]]
key = "cpu.overprovisioning.factor"
scope = "cluster"
target = "*"
value = 1.0

[[setting]]
key = "mem.overprovisioning.factor"
scope = "cluster"
target = "*"
value = 1.0

[[setting]]
key = "cluster.cpu.allocated.capacity.disablethreshold"
scope = "cluster"
target = "*"
value = 1.0

[[setting]]
key = "cluster.memory.allocated.capacity.disablethreshold"
scope = "cluster"
target = "*"
value = 1.0

[[setting]]
key = "drs.automatic.enable"
scope = "cluster"
target = "*"
value = false

# no live scaling or migration: an instance keeps the cores it started on,
# and a host's maintenance stops the instances on its local storage
[[setting]]
key = "enable.dynamic.scale.vm"
value = false

[[setting]]
key = "enable.dynamic.scale.vm"
scope = "zone"
target = "*"
value = false

[[setting]]
key = "host.maintenance.local.storage.strategy"
value = "ForceStop"

# quota counts stopped instances too and checks every host tag with limits
[[setting]]
key = "resource.count.running.vms.only"
value = false

[[setting]]
key = "vm.strict.resource.limit.host.tag.check"
value = true

# no hypervisor configuration of the user's own
[[setting]]
key = "enable.additional.vm.configuration"
value = false

# Volumes, snapshots and moves

# the root disk: 20 GiB unless the user gives a size, at least 10 GiB
[[setting]]
key = "vm.root.disk.size.default"
value = 20

[[setting]]
key = "vm.root.disk.size.min"
value = 10

# only the storage quota bounds a volume, and volumes and snapshots share it
[[setting]]
key = "custom.diskoffering.size.min"
value = 1

[[setting]]
key = "custom.diskoffering.size.max"
value = 65536

[[setting]]
key = "storage.max.volume.size"
value = 65536

[[setting]]
key = "resource.limit.storage.combined"
value = true

# no overprovisioning of the local storage
[[setting]]
key = "storage.overprovisioning.factor"
scope = "storagepool"
target = "*"
value = 1.0

# destroying an instance keeps its root volume unless the caller says otherwise
[[setting]]
key = "destroy.root.volume.on.vm.destruction"
value = false

# destroying an instance or a volume deletes it at once: there is no
# recoverable Destroyed state to come back from
[[setting]]
key = "expunge.on.destroy"
value = true

# snapshots are kept on secondary storage (read at start), each one whole
[[setting]]
key = "snapshot.backup.to.secondary"
value = true

[[setting]]
key = "kvm.incremental.snapshot"
scope = "cluster"
target = "*"
value = false

# a move copies the volume and keeps the previous copy; a host without a rate
# of its own (cloudstack/tools/cs_partition.py set-move-rate) is estimated at
# this one
[[setting]]
key = "volume.move.keep.source"
value = true

[[setting]]
key = "volume.move.estimate.mbps"
value = 800

[[setting]]
key = "placement.token.expiry.seconds"
value = 900

# at most this many copies per host at once, as source or destination; <=0: unbounded
[[setting]]
key = "volume.move.concurrency.per.host"
value = 2

# a move of 1 TiB and the start after it take hours
[[setting]]
key = "job.cancel.threshold.minutes"
value = 720

[[setting]]
key = "copy.volume.wait"
value = 21600

# GPU lease

# GPU instances stop when their lease (the compute catalog's lease_hours)
# ends unless renewed, with warnings 4 and 1 hours before; both schedulers
# run every 5 minutes (read at start)
[[setting]]
key = "instance.lease.enabled"
value = true

[[setting]]
key = "instance.lease.scheduler.interval"
value = 300

[[setting]]
key = "instance.lease.eventscheduler.interval"
value = 300

[[setting]]
key = "instance.lease.expiryevent.hoursbefore"
value = "4,1"

[[setting]]
key = "instance.lease.renewal.enabled"
value = true

# Mail of the quota requests, once a relay exists: uncomment and fill in, and
