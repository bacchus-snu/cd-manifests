# CloudStack settings, kept by the sync job (sync.py: sync_settings) as the
# admin user, whose account has the built-in Root Admin role: only that role
# may change the settings that govern access control. A setting is written
# only where its value differs. A key the running management server does not
# know yet is skipped; a changed key that is not dynamic is logged as
# "restart required: <key>" and applies from the management server's next
# start. A failing entry fails the run once the others are applied.
#
# Each [[setting]] has a key and either value (a string, number or boolean)
# or value_env, the variable of the job's environment that holds the value (a
# Vault secret, sync.yaml; never printed). Its scope is global (the default),
# zone, cluster, storagepool, domain or account; any scope but global names
# its target: the zone, cluster, storage pool or account name, the domain path
# (ROOT/snucse), or * for every one of them.
#
# resource.limit.host.tags is not set here: the job writes it from
# compute-catalog.json, the CPU-only offering's tag and then every GPU type's.

# New accounts

# The account defaults: every account's limits until a quota grant raises
# them, read again by every quota recompute. 0 before launch; GPUs come by
# grant only; the snapshot count is unlimited, as the storage quota bounds
# what snapshots hold.
[[setting]]
key = "max.account.cpus"
value = 0

[[setting]]
key = "max.account.memory"
value = 0

[[setting]]
key = "max.account.gpus"
value = 0

[[setting]]
key = "max.account.user.vms"
value = 0

[[setting]]
key = "max.account.volumes"
value = 0

[[setting]]
key = "max.account.primary.storage"
value = 0

[[setting]]
key = "max.account.secondary.storage"
value = 0

[[setting]]
key = "max.account.snapshots"
value = -1

[[setting]]
key = "max.account.templates"
value = 0

[[setting]]
key = "max.account.networks"
value = 0

[[setting]]
key = "max.account.vpcs"
value = 0

[[setting]]
key = "max.account.public.ips"
value = 0

[[setting]]
key = "max.account.projects"
value = 0

[[setting]]
key = "max.account.backups"
value = 0

[[setting]]
key = "max.account.backup.storage"
value = 0

[[setting]]
key = "max.account.buckets"
value = 0

[[setting]]
key = "max.account.object.storage"
value = 0

