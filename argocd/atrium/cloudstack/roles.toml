# Custom CloudStack roles, kept by the sync job (sync.py: sync_roles). A role
# whose live rules, type or description differ is re-imported in one
# transaction; its id, and so every account holding it, stays. The first
# matching rule decides; an API no rule matches falls back to what the role
# type allows by default.

# Bacchus members (OpenID provider "bacchus"): runs the cloud, but cannot change
# who may do what. Admin type, so it sees and manages every account's
# resources and the infrastructure. The setting
# role.types.allowed.for.operations.on.accounts.of.same.role.type, which must
# not list Admin, keeps it away from the users and keys of other Admin
# accounts, including the default admin whose keys the sync job uses.
[[role]]
name = "Bacchus Member"
type = "Admin"
description = "Bacchus members: operations without roles, settings, sign-in, accounts or management-server code"
rules = [
  # an allow rule added to its own role would make it root
  ["createRole", "deny"],
  ["updateRole", "deny"],
  ["deleteRole", "deny"],
  ["importRole", "deny"],
  ["enableRole", "deny"],
  ["disableRole", "deny"],
  ["createRolePermission", "deny"],
  ["updateRolePermission", "deny"],
  ["deleteRolePermission", "deny"],
  # settings include dynamic.apichecker.enabled, which switches role rules off
  ["updateConfiguration", "deny"],
  ["resetConfiguration", "deny"],
  # sign-in goes through the OpenID providers only
  ["addLdapConfiguration", "deny"],
  ["deleteLdapConfiguration", "deny"],
  ["ldapConfig", "deny"],
  ["ldapRemove", "deny"],
  ["listLdapConfigurations", "deny"],
  ["ldapCreateAccount", "deny"],
  ["importLdapUsers", "deny"],
  ["linkDomainToLdap", "deny"],
  ["unlinkDomainFromLdap", "deny"],
  ["linkAccountToLdap", "deny"],
  ["authorizeSamlSso", "deny"],
  # an OpenID provider decides who gets an account of which role; only the
  # built-in Root Admin role and the sync job configure providers
  ["*OidcProvider*", "deny"],
  # accounts, their roles and their users come from sign-in; an Admin-type
  # caller may set its own password without the current one, which would be a
  # way in around sign-in
  ["createAccount", "deny"],
  ["createUser", "deny"],
  ["updateAccount", "deny"],
  ["updateUser", "deny"],
  # a user moved into another account takes that account's role
  ["moveUser", "deny"],
  # extensions run scripts on the management server
  ["*Extension", "deny"],
  ["*CustomAction", "deny"],
  # the CA signs host and agent certificates; the console certificate is the sync job's
  ["issueCertificate", "deny"],
  ["revokeCertificate", "deny"],
  ["uploadCustomCertificate", "deny"],
  # these moves delete the source copy; a disk moves in its owner's approved
  # flow, otherwise only the built-in Root Admin role moves it
  ["migrateVolume", "deny"],
  ["migrateVirtualMachine", "deny"],
  ["migrateVirtualMachineWithVolume", "deny"],
  ["*", "allow"],
]

# SNUCSE ID students (OpenID provider "snucse"): default-deny. The role allows
# exactly the commands of the student UI (instances, volumes, volume snapshots,
# tags, API keys, the placement checks, quota requests and GPU lease renewal)
# and denies everything else, so a command that a CloudStack release adds stays
# closed until it is listed here. Every allow names one command: a wildcard is
# a case-insensitive substring and would also open the commands whose names
# merely contain it. Events are the audit trail: users read them but neither
# archive nor delete them. The user itself is its OpenID provider's: no
# password of one's own.
[[role]]
name = "SNUCSE User"
type = "User"
description = "SNUCSE ID students: instances, volumes, volume snapshots, tags, API keys, quota requests and GPU leases"
rules = [
  ["attachVolume", "allow"],
  ["cancelResourceLimitRequest", "allow"],
  ["checkPlacement", "allow"],
  ["createConsoleEndpoint", "allow"],
  ["createResourceLimitRequest", "allow"],
  ["createSnapshot", "allow"],
  ["createSnapshotPolicy", "allow"],
  ["createTags", "allow"],
  ["createVolume", "allow"],
  ["deleteSnapshot", "allow"],
  ["deleteSnapshotPolicies", "allow"],
  ["deleteTags", "allow"],
  ["deleteUserKeys", "allow"],
  ["deleteVolume", "allow"],
  ["deployVirtualMachine", "allow"],
  ["destroyVirtualMachine", "allow"],
  ["destroyVolume", "allow"],
  ["detachVolume", "allow"],
  ["extractVolume", "allow"],
  ["getUserKeys", "allow"],
  ["listAccounts", "allow"],
  ["listApis", "allow"],
  ["listCapabilities", "allow"],
  ["listDiskOfferings", "allow"],
  ["listEvents", "allow"],
  ["listGuiThemes", "allow"],
  ["listOsCategories", "allow"],
  ["listPlacementCapacity", "allow"],
  ["listResourceIcon", "allow"],
  ["listResourceLimitRequests", "allow"],
  ["listResourceLimits", "allow"],
  ["listServiceOfferings", "allow"],
  ["listSnapshotPolicies", "allow"],
  ["listSnapshots", "allow"],
  ["listTags", "allow"],
  ["listTemplates", "allow"],
  ["listUserKeyRules", "allow"],
  ["listUserKeys", "allow"],
  ["listUsers", "allow"],
  ["listVirtualMachines", "allow"],
  ["listVirtualMachinesMetrics", "allow"],
  ["listVirtualMachinesUsageHistory", "allow"],
  ["listVolumes", "allow"],
  ["listVolumesMetrics", "allow"],
  ["listVolumesUsageHistory", "allow"],
  ["listZones", "allow"],
  ["queryAsyncJobResult", "allow"],
  ["rebootVirtualMachine", "allow"],
  ["recoverVolume", "allow"],
  ["registerUserKeys", "allow"],
  ["renewVirtualMachineLease", "allow"],
  ["resetPasswordForVirtualMachine", "allow"],
  ["resizeVolume", "allow"],
  ["restoreVirtualMachine", "allow"],
  ["revertSnapshot", "allow"],
  ["scaleVirtualMachine", "allow"],
  ["startVirtualMachine", "allow"],
  ["stopVirtualMachine", "allow"],
  ["updateSnapshot", "allow"],
  ["updateVirtualMachine", "allow"],
  ["updateVolume", "allow"],
  ["*", "deny"],
]
