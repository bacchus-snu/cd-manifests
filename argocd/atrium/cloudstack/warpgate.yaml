---
# Warpgate: SSH bastion in front of the guests. Users log in with SNUCSE ID or,
# Bacchus members, with Auth0 (SSO, through the web UI link Warpgate prints in
# the terminal) and reach their VMs on the guest overlay; targets, roles and
# users follow CloudStack through the sync job (sync.py).
# keys: admin_password (web admin user, created on first boot), admin_token
# (admin API token for the sync job), oidc_client_secret (client "warpgate" at
# id.snucse.org), bacchus_client_id and bacchus_client_secret (Auth0
# application "cloudstack-warpgate"; until they exist the provider cannot sign
# anyone in). Warpgate restarts when the secret changes, so that the config
# container renders the configuration again.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: warpgate
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: secret
  path: cloudstack/warpgate
  # without it VSO reads the path again only when this object changes
  refreshAfter: 5m
  destination:
    create: true
    name: warpgate
  rolloutRestartTargets:
    - kind: StatefulSet
      name: warpgate
---
# keys: client-ed25519, client-rsa (what Warpgate signs in to guests with, as
# OpenSSH private keys; guests trust only the keys they were created with),
# host-ed25519, host-rsa (the gateway's host keys, pinned by every SSH client;
# the exact text the database holds). No passphrases. Warpgate keeps its keys
# in its database: the init containers create every database from these and
# refuse to start one whose host keys differ, and the sync job holds the
# client keys to them. Warpgate restarts when they change, so that a changed
# host key meets that check at once rather than at some later restart.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: warpgate-ssh-keys
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: secret
  path: cloudstack/warpgate-ssh-keys
  refreshAfter: 5m
  destination:
    create: true
    name: warpgate-ssh-keys
  rolloutRestartTargets:
    - kind: StatefulSet
      name: warpgate
---
# Warpgate refuses to serve HTTP without a certificate, and the sync job and the
# sidecar verify it by this name
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: warpgate-tls
spec:
  secretName: warpgate-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    algorithm: ECDSA
  dnsNames:
    - login.cloud.snucse.org
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: warpgate-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: warpgate
spec:
  serviceName: warpgate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudstack-management
      app.kubernetes.io/instance: cloudstack
      app.kubernetes.io/component: bastion
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bastion
    spec:
      nodeSelector:
        cloudstack.snucse.org/overlay-gateway: 'true'
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      initContainers:
        # Warpgate generates random keys for any it finds missing, so: without a
        # database, one is created only when all four declared keys are there;
        # every boot, the database must hold the declared host keys (as plain
        # text) and some client key, or Warpgate does not start. The Warpgate
        # image holds no shell, so the scripts run in the Python image.
        # config: our configuration with the secret filled in
        - name: config
          image: python # replaced by kustomize
          command:
            - sh
            - -ec
            - |
              keys=/ssh-keys db=/data/db/db.sqlite3
              if [ ! -f $db ]; then
                for k in client-ed25519 client-rsa host-ed25519 host-rsa; do
                  [ -s $keys/$k ] || { echo "no database and no declared $k: not creating one" >&2; exit 1; }
                done
                rm -rf /data/db /data/db.new
                mkdir -m 700 /data/db
              fi
              sed -e "s|\${OIDC_CLIENT_SECRET}|$OIDC_CLIENT_SECRET|" \
                -e "s|\${BACCHUS_CLIENT_ID}|$BACCHUS_CLIENT_ID|" \
                -e "s|\${BACCHUS_CLIENT_SECRET}|$BACCHUS_CLIENT_SECRET|" \
                /config/warpgate-config.yaml > /data/warpgate.yaml
              chmod 600 /data/warpgate.yaml
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: warpgate
                  key: oidc_client_secret
            - name: BACCHUS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: warpgate
                  key: bacchus_client_id
                  optional: true
            - name: BACCHUS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: warpgate
                  key: bacchus_client_secret
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: ssh-keys
              mountPath: /ssh-keys
              readOnly: true
        # setup: migrates the database and, while it has no user, creates the
        # admin user and imports the declared keys
        - name: setup
          image: warpgate # replaced by kustomize
          args:
            - --config
            - /data/warpgate.yaml
            - unattended-setup
            - --if-config-exists=bootstrap
            - --data-path=/data
            - --http-port=8888
            - --import-ssh-host-keys=/ssh-keys
            - --import-ssh-client-keys=/ssh-keys
          env:
            - name: WARPGATE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: warpgate
                  key: admin_password
          volumeMounts:
            - name: data
              mountPath: /data
            - name: ssh-keys
              mountPath: /ssh-keys
              readOnly: true
        - name: check
          image: python # replaced by kustomize
          command:
            - python
            - -c
            - |
              import pathlib
              import sqlite3
              import sys


              def text(value):
                  return "\n".join(line for line in value.replace("\r", "").splitlines() if line.strip())


              db = sqlite3.connect("file:/data/db/db.sqlite3?mode=ro", uri=True)
              for kind in ("ed25519", "rsa"):
                  held = text(db.execute(f"select ssh_host_key_{kind} from parameters").fetchone()[0] or "")
                  if not held:
                      sys.exit(f"the database holds no {kind} host key")
                  declared = pathlib.Path(f"/ssh-keys/host-{kind}")
                  if declared.is_file() and declared.stat().st_size and held != text(declared.read_text()):
                      sys.exit(f"the database holds another {kind} host key than the declared one")
              if not db.execute("select count(*) from ssh_client_keys").fetchone()[0]:
                  sys.exit("the database holds no client key")
          volumeMounts:
            - name: data
              mountPath: /data
            - name: ssh-keys
              mountPath: /ssh-keys
              readOnly: true
      containers:
        - name: warpgate
          image: warpgate # replaced by kustomize
          args: [--config, /data/warpgate.yaml, run, --enable-admin-token]
          env:
            - name: WARPGATE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: warpgate
                  key: admin_token
          ports:
            # SSH entry point, bound on the gateway node so clients keep their
            # own address: Warpgate's login protection blocks by source IP, and
            # behind a shared address Internet scanners get everyone blocked
            - name: ssh
              containerPort: 2222
              hostPort: 2222
            - name: https
              containerPort: 8888
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
        # plain HTTP for the gateway, re-encrypted to Warpgate on the loopback
        - name: proxy
          image: nginx # replaced by kustomize
          ports:
            - name: web
              containerPort: 8080
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: warpgate-data
        - name: config
          configMap:
            name: warpgate-config
        # optional: a database that exists does not need them to serve
        - name: ssh-keys
          secret:
            secretName: warpgate-ssh-keys
            optional: true
            defaultMode: 0440
            items:
              - key: client-ed25519
                path: client-ed25519
              - key: client-rsa
                path: client-rsa
              - key: host-ed25519
                path: host-ed25519
              - key: host-rsa
                path: host-rsa
        - name: tls
          secret:
            secretName: warpgate-tls
        - name: nginx
          configMap:
            name: warpgate-nginx
            items:
              - key: warpgate-nginx.conf
                path: default.conf
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
# web UI and admin API: "web" for the gateway (plain HTTP via the sidecar),
# "https" for the sync job (Warpgate's own TLS)
apiVersion: v1
kind: Service
metadata:
  name: warpgate
spec:
  selector:
    app.kubernetes.io/name: cloudstack-management
    app.kubernetes.io/instance: cloudstack
    app.kubernetes.io/component: bastion
  ports:
    - name: web
      port: 8080
      targetPort: web
    - name: https
      port: 8888
      targetPort: https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: warpgate
spec:
  parentRefs:
    - namespace: cilium-system
      name: web-gateway
      sectionName: https-cloud-snucse-org
  hostnames:
    - login.cloud.snucse.org
  rules:
    - backendRefs:
        - name: warpgate
          port: 8080
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
