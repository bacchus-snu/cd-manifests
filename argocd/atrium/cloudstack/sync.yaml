---
# Periodic reconciliation of state that follows CloudStack (see sync.py).
# Authenticates to the CloudStack API with the admin user's API keys.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudstack-api
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: secret
  path: cloudstack/api
  destination:
    create: true
    name: cloudstack-api
---
# Client credentials of the OpenID providers (idps.toml). keys: client_id,
# client_secret (client "cloudstack" at id.snucse.org, redirect
# https://cloud.snucse.org/client/oidc/callback/snucse). The job reads the
# Secret as it starts, every minute.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudstack-oauth
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: secret
  path: cloudstack/oauth-snucse-id
  # without it VSO reads the path again only when this object changes
  refreshAfter: 5m
  destination:
    create: true
    name: cloudstack-oauth
---
# keys: client_id, client_secret (Auth0 application "cloudstack", redirect
# https://cloud.snucse.org/client/oidc/callback/bacchus). Until the path exists
# the provider is not created; the gate restarts when the secret appears or
# changes.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudstack-oauth-bacchus
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: secret
  path: cloudstack/oauth-bacchus
  refreshAfter: 5m
  destination:
    create: true
    name: cloudstack-oauth-bacchus
  rolloutRestartTargets:
    - kind: Deployment
      name: gate
---
# key: membership_secret, the JSON key of the Google Workspace service account
# that reads group membership for the bacchus provider's periodic check. Until
# the path exists the provider has no membership source.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudstack-oidc-membership-bacchus
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: secret
  path: cloudstack/oidc-membership-bacchus
  refreshAfter: 5m
  destination:
    create: true
    name: cloudstack-oidc-membership-bacchus
---
# The job's own state, which CloudStack never shows: keyed digests of the
# write-only values it last wrote (provider secrets, encrypted settings), and
# the settings it wrote that wait for a management server restart. It writes
# only the data, which this manifest leaves out.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudstack-sync-state
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudstack-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudstack-sync
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, create, update]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cloudstack-sync-state]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudstack-sync
subjects:
  - kind: ServiceAccount
    name: cloudstack-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudstack-sync
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudstack-sync
spec:
  schedule: '* * * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 50
      template:
        spec:
          serviceAccountName: cloudstack-sync
          # no Docker-style *_PORT variables for the namespace's Services
          enableServiceLinks: false
          restartPolicy: Never
          containers:
            - name: sync
              image: python # replaced by kustomize
              command: [python3, /opt/sync/sync.py]
              env:
                - name: CLOUDSTACK_API_URL
                  value: http://cloudstack-management:8080/client/api
                - name: CLOUDSTACK_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cloudstack-api
                      key: api_key
                - name: CLOUDSTACK_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cloudstack-api
                      key: secret_key
                - name: BASTION_HOST
                  value: warpgate
                - name: BASTION_TLS_NAME
                  value: login.cloud.snucse.org
                # the gate's doors: domain -> Warpgate SSO provider
                - name: BASTION_SSO
                  value: ROOT=bacchus,ROOT/snucse=snucse
                - name: BASTION_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: warpgate
                      key: admin_token
                # OpenID providers (idps.toml): OIDC_<NAME>_CLIENT_ID,
                # OIDC_<NAME>_CLIENT_SECRET, OIDC_<NAME>_MEMBERSHIP_SECRET
                - name: OIDC_SNUCSE_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: cloudstack-oauth
                      key: client_id
                      optional: true
                - name: OIDC_SNUCSE_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: cloudstack-oauth
                      key: client_secret
                      optional: true
                - name: OIDC_BACCHUS_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: cloudstack-oauth-bacchus
                      key: client_id
                      optional: true
                - name: OIDC_BACCHUS_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: cloudstack-oauth-bacchus
                      key: client_secret
                      optional: true
                - name: OIDC_BACCHUS_MEMBERSHIP_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: cloudstack-oidc-membership-bacchus
                      key: membership_secret
                      optional: true
              volumeMounts:
                - name: script
                  mountPath: /opt/sync
                - name: console-tls
                  mountPath: /etc/console-tls
                  readOnly: true
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: cloudstack-sync
            # console proxy certificate (console.yaml); optional so the job
            # keeps running until cert-manager has issued it
            - name: console-tls
              secret:
                secretName: console-proxy-tls
                optional: true
                items:
                  - key: tls.crt
                    path: tls.crt
                  - key: tls.key
                    path: tls.key
