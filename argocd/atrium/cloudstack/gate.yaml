---
# Sign-in gate (gate.py): the only way into CloudStack. Its doors (gate.toml)
# are SNUCSE ID for students and Auth0 (bacchus.snucse.org Google accounts) for
# Bacchus members; the gate checks the door's group, creates or updates the
# account and starts the CloudStack session itself. The client credentials of
# its doors (Secrets cloudstack-oauth, cloudstack-oauth-bacchus) are shared with
# the OpenID providers of the same names (sync.yaml); each client has the
# gate's redirect, https://cloud.snucse.org/gate/<door>/callback, registered
# next to the provider's.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudstack-management
      app.kubernetes.io/instance: cloudstack
      app.kubernetes.io/component: gate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gate
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: gate
          image: python # replaced by kustomize
          command: [python3, /opt/gate/gate.py]
          envFrom:
            - configMapRef:
                name: gate-config
          env:
            - name: GATE_DOORS
              value: /opt/gate/gate.toml
            - name: SNUCSE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cloudstack-oauth
                  key: client_id
            - name: SNUCSE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudstack-oauth
                  key: client_secret
            - name: BACCHUS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cloudstack-oauth-bacchus
                  key: client_id
                  optional: true
            - name: BACCHUS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudstack-oauth-bacchus
                  key: client_secret
                  optional: true
            - name: CLOUDSTACK_API_URL
              value: http://cloudstack-management:8080/client/api
            - name: CLOUDSTACK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudstack-api
                  key: api_key
            - name: CLOUDSTACK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudstack-api
                  key: secret_key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /gate/healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: script
              mountPath: /opt/gate
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: cloudstack-gate
---
apiVersion: v1
kind: Service
metadata:
  name: gate
spec:
  selector:
    app.kubernetes.io/name: cloudstack-management
    app.kubernetes.io/instance: cloudstack
    app.kubernetes.io/component: gate
  ports:
    - name: http
      port: 8080
      targetPort: http
