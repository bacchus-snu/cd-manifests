# Lets guests push metrics to Prometheus's remote write receiver and nothing
# else: only POST /api/v1/write, and only from the hypervisors' campus
# addresses, which guest traffic is masqueraded to (cloudstack/hosts).
worker_processes 1;
pid /var/cache/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    log_format receiver '$remote_addr via $realip_remote_addr "$request" $status $body_bytes_sent';
    access_log /dev/stdout receiver;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    # The Cilium gateway runs in the host network and reaches pods from the
    # pod range; it appends the client address to X-Forwarded-For, so the
    # address left of the trusted hops is the client's.
    set_real_ip_from 10.244.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 8m;

    server {
        listen 8080;

        location = /healthz {
            access_log off;
            return 200 "OK\n";
        }

        location = /api/v1/write {
            # campus_ip of every host in cloudstack/hosts/inventory.yaml
            allow 147.46.240.204;  # derby
            allow 147.46.240.145;  # eggnog
            allow 147.46.241.137;  # faust
            allow 147.46.240.221;  # cojito
            allow 147.46.242.203;  # jackdaniels
            allow 147.46.241.143;  # jimbeam
            deny all;

            limit_except POST {
                deny all;
            }

            proxy_pass http://cloudstack-prometheus:9090;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            return 404;
        }
    }
}
