---
apiVersion: v1
kind: Service
metadata:
  name: metrics-receiver
spec:
  selector:
    app.kubernetes.io/name: metrics-receiver
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-receiver
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-receiver
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx
          args: [nginx, -c, /etc/nginx/receiver/nginx.conf, -g, "daemon off;"]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/receiver
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: metrics-receiver-config
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metrics-receiver
spec:
  hostnames:
    - metrics.cloud.snucse.org
  parentRefs:
    - namespace: cilium-system
      name: web-gateway
      sectionName: https-cloud-snucse-org
  rules:
    - backendRefs:
        - name: metrics-receiver
          port: 80
