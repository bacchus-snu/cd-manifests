# Metrics that CloudStack guests push: the GPU image's vmagent sends its
# dcgm-exporter metrics, labelled instance_id=<VM UUID>, to the remote write
# receiver through metrics-receiver (receiver.yaml). Nothing is scraped here.
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: cloudstack-guests
spec:
  version: v3.15.0
  enableRemoteWriteReceiver: true
  # no scrape targets or rules are selected (an unset selector selects none)
  retention: 30d
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 1Gi
  securityContext:
    fsGroup: 2000
    runAsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOncePod
        resources:
          requests:
            storage: 20Gi
---
# stable address of the Prometheus pod, for metrics-receiver and Grafana
# (prometheus-operated is headless: its address changes with the pod)
apiVersion: v1
kind: Service
metadata:
  name: cloudstack-prometheus
spec:
  selector:
    operator.prometheus.io/name: cloudstack-guests
  ports:
    - name: http
      port: 9090
      targetPort: 9090
