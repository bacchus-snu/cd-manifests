---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bacchus-howto
spec:
  hostnames:
    - howto.bacchus.io
  parentRefs:
    - namespace: cilium-system
      name: web-gateway
      sectionName: https-bacchus-io
  rules:
    - backendRefs:
        - name: bacchus-howto-oauth2-proxy
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: bacchus-howto
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bacchus-howto
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: caddy
          image: ghcr.io/bacchus-snu/howto
          args:
            - caddy
            - file-server
            - --root=/srv/howto
            - --listen=:8080
            - --access-log
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            tcpSocket:
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  namespace: bacchus-howto
  name: default
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vault-secrets-operator
    serviceAccount: default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: bacchus-howto-oauth2-proxy
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: secret
  path: bacchus-howto/oauth2-proxy
  destination:
    create: true
    name: bacchus-howto-oauth2-proxy
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: secret
  path: bacchus-howto/ghcr-pull
  destination:
    create: true
    name: ghcr-pull
    type: kubernetes.io/dockerconfigjson
