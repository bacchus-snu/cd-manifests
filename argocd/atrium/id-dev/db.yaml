---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  namespace: id-dev
  name: id-dev-db
spec:
  instances: 1
  storage:
    size: 8Gi
    storageClass: rbd
  bootstrap:
    initdb:
      database: id
      owner: id
      secret:
        name: id-dev-db-creds
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: id-dev-db-schema
            key: schema.sql
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
