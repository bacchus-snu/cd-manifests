ipam:
  mode: kubernetes

kubeProxyReplacement: true
k8sServiceHost: atrium.bacchus.io
k8sServicePort: 6443

MTU: 1500

encryption:
  enabled: true
  type: wireguard

bpf:
  masquerade: true

operator:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    maxUnavailable: null
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists

gatewayAPI:
  enabled: true
  enableAlpn: true
  hostNetwork:
    enabled: true
    nodes:
      matchLabels:
        bacchus.io/web-gateway: 'true'

envoy:
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
