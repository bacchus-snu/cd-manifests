---
apiVersion: v1
kind: Namespace
metadata:
  name: cilium-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  namespace: cilium-system
  name: web-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/private-key-algorithm: ECDSA
    external-dns.alpha.kubernetes.io/target: 147.46.92.174
  labels:
    external-dns.alpha.kubernetes.io/include: "true"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-id-snucse-org
      protocol: HTTPS
      port: 443
      hostname: "id.snucse.org"
      tls:
        certificateRefs:
          - name: web-gateway-id-cert
      allowedRoutes:
        namespaces:
          from: All
    - name: https-id-dev-bacchus-io
      protocol: HTTPS
      port: 443
      hostname: "id-dev.bacchus.io"
      tls:
        certificateRefs:
          - name: web-gateway-id-dev-cert
      allowedRoutes:
        namespaces:
          from: All
    - name: https-snucse-org
      protocol: HTTPS
      port: 443
      hostname: "*.snucse.org"
      tls:
        certificateRefs:
          - name: web-gateway-certs
      allowedRoutes:
        namespaces:
          from: All
    # CloudStack: the wildcard above does not cover second-level names
    - name: https-cloud-snucse-org
      protocol: HTTPS
      port: 443
      hostname: "*.cloud.snucse.org"
      tls:
        certificateRefs:
          - name: web-gateway-cloud-certs
      allowedRoutes:
        namespaces:
          from: All
    - name: apex-snucse-org
      protocol: HTTPS
      port: 443
      hostname: "snucse.org"
      tls:
        certificateRefs:
          - name: web-gateway-certs
      allowedRoutes:
        namespaces:
          from: All
    - name: tls-zest-snucse-org
      protocol: TLS
      port: 443
      hostname: "zest.snucse.org"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TLSRoute
    - name: https-bacchus-io
      protocol: HTTPS
      port: 443
      hostname: "*.bacchus.io"
      tls:
        certificateRefs:
          - name: web-gateway-certs
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: cilium-system
  name: web-gateway-https-redirect
  annotations:
    # Otherwise, external-dns creates a wildcard record
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: web-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: cilium-system
  name: web-gateway-default-redirect
  annotations:
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: web-gateway
      sectionName: http
  rules:
    - matches:
        - headers:
            - name: Host
              type: Exact
              value: 147.46.92.174
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: id.snucse.org
            port: 443
            statusCode: 302
