---
apiVersion: v1
kind: Service
metadata:
  name: deb-mirror
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deb-mirror
spec:
  template:
    spec:
      containers:
        - name: nginx
          image: nginx
          args: [nginx, -c, /var/cache/nginx/nginx.conf, -g, "daemon off;"]
          env:
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: '1'
            - name: NGINX_ENVSUBST_OUTPUT_DIR
              value: /var/cache/nginx
            - name: NGINX_ENVSUBST_FILTER
              value: ^NGINX_LOCAL_RESOLVERS$
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: config
              mountPath: /etc/nginx/templates
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 10Gi
            limits:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 15Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        fsGroup: 1337
      volumes:
        - name: config
          configMap:
            name: deb-mirror-config
        - name: cache
          emptyDir:
            sizeLimit: 15Gi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deb-mirror
spec:
  hostnames:
    - mirror.snucse.org
  parentRefs:
    - namespace: cilium-system
      name: web-gateway
      sectionName: https-snucse-org
    - namespace: cilium-system
      name: web-gateway
      sectionName: http
  rules:
    - backendRefs:
        - name: deb-mirror
          port: 80
