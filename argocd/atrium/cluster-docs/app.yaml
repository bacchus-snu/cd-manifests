---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: cluster-docs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    name: in-cluster
    namespace: cluster-docs
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: ghcr.io/bacchus-snu
      targetRevision: '20261016.1'
      chart: cluster-docs
      helm:
        valueFiles:
          - $values/argocd/atrium/cluster-docs/values.yaml
    - repoURL: https://github.com/bacchus-snu/cd-manifests.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/bacchus-snu/cd-manifests.git
      targetRevision: main
      path: argocd/atrium/cluster-docs
      directory:
        include: 'resources.yaml'
