---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: snucse
  name: snucse
spec:
  parentRefs:
    - namespace: cilium-system
      name: web-gateway
      sectionName: https-snucse-org
  hostnames:
    - www.snucse.org
  rules:
    # default route to frontend
    - backendRefs:
        - name: snucse-front
          port: 80
    # backend routes
    - backendRefs:
        - name: snucse-back
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type:
            value: /files
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: cilium-system
  name: redirect-to-www
  annotations:
    # Otherwise, external-dns struggles with creating the CNAME at the apex
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: web-gateway
      sectionName: apex-snucse-org
  hostnames:
    - snucse.org
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: www.snucse.org
            port: 443
            statusCode: 301
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  namespace: snucse
  name: default
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vault-secrets-operator
    serviceAccount: default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: db-pw
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: secret
  path: snucse/db
  destination:
    create: true
    name: db-pw
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: snucse-pbs
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: secret
  path: snucse/pbs
  destination:
    create: true
    name: snucse-pbs

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: snucse-backup
spec:
  schedule: '@daily'
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: tmp
              emptyDir: {}
            - name: scratch
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    accessModes:
                      - ReadWriteOncePod
                    resources:
                      requests:
                        storage: 1Gi
          initContainers:
            - name: create-mysqldump
              image: mysql:8.4.11
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
              env:
                - name: MYSQL_USER
                  value: root
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      key: rootPassword
                      name: db-pw
                - name: MYSQL_HOST
                  value: snucse
                - name: MYSQL_PORT
                  value: '3306'
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile:
                  type: RuntimeDefault
              args:
                - /bin/bash
                - -c
                - |
                    set -euxo pipefail
                    mysqldump --host=${MYSQL_HOST} --port=${MYSQL_PORT} --user=${MYSQL_USER} --single-transaction --routines --triggers --all-databases > /scratch/mysqldump.sql
          containers:
            - name: backup
              image: ghcr.io/bacchus-snu/images/proxmox-backup-client:5575324
              envFrom:
                - secretRef:
                    name: snucse-pbs
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: scratch
                  mountPath: /scratch
              resources:
                requests:
                  cpu: 100m
                  memory: 1Gi
                limits:
                  cpu: 100m
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile:
                  type: RuntimeDefault
              args: ['backup', '--ns=atrium', '--backup-id=snucse', '--backup-type=ct', 'pgdump.pxar:/scratch']
          securityContext:
            fsGroup: 1337
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: files-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: files-backup
rules:
  - apiGroups: ['snapshot.storage.k8s.io']
    resources: ['volumesnapshots']
    verbs: ['create', 'delete', 'get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['persistentvolumeclaims']
    verbs: ['create', 'delete', 'get', 'list', 'watch']
  - apiGroups: ['batch']
    resources: ['jobs']
    verbs: ['create', 'delete', 'get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: files-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: files-backup
subjects:
  - kind: ServiceAccount
    name: files-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: snucse-files-backup
spec:
  schedule: '@daily'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: files-backup
          containers:
            - name: orchestrate
              image: registry.k8s.io/kubectl:v1.36.4
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile:
                  type: RuntimeDefault
              args:
                - /bin/sh
                - -c
                - |
                    set -euo pipefail
                    tag=$(date -u +%Y%m%d%H%M%S)
                    trap 'kubectl delete --ignore-not-found --wait=false \
                      job/files-$tag pvc/files-$tag-attachment pvc/files-$tag-uploads \
                      volumesnapshot/files-$tag-attachment volumesnapshot/files-$tag-uploads' EXIT

                    for v in attachment uploads; do
                      kubectl create -f - <<YAML
                    apiVersion: snapshot.storage.k8s.io/v1
                    kind: VolumeSnapshot
                    metadata:
                      name: files-$tag-$v
                    spec:
                      volumeSnapshotClassName: rbd
                      source:
                        persistentVolumeClaimName: $v-snucse-back-0
                    YAML
                    done
                    kubectl wait --for=jsonpath='{.status.readyToUse}'=true --timeout=10m \
                      volumesnapshot/files-$tag-attachment volumesnapshot/files-$tag-uploads

                    kubectl create -f - <<YAML
                    apiVersion: v1
                    kind: PersistentVolumeClaim
                    metadata:
                      name: files-$tag-attachment
                    spec:
                      storageClassName: rbd
                      accessModes: [ReadWriteOnce]
                      resources:
                        requests:
                          storage: 128Gi
                      dataSource:
                        apiGroup: snapshot.storage.k8s.io
                        kind: VolumeSnapshot
                        name: files-$tag-attachment
                    ---
                    apiVersion: v1
                    kind: PersistentVolumeClaim
                    metadata:
                      name: files-$tag-uploads
                    spec:
                      storageClassName: rbd
                      accessModes: [ReadWriteOnce]
                      resources:
                        requests:
                          storage: 1Gi
                      dataSource:
                        apiGroup: snapshot.storage.k8s.io
                        kind: VolumeSnapshot
                        name: files-$tag-uploads
                    ---
                    apiVersion: batch/v1
                    kind: Job
                    metadata:
                      name: files-$tag
                    spec:
                      backoffLimit: 1
                      template:
                        spec:
                          restartPolicy: Never
                          volumes:
                            - name: tmp
                              emptyDir: {}
                            - name: attachment
                              persistentVolumeClaim:
                                claimName: files-$tag-attachment
                            - name: uploads
                              persistentVolumeClaim:
                                claimName: files-$tag-uploads
                          containers:
                            - name: backup
                              image: ghcr.io/bacchus-snu/images/proxmox-backup-client:5575324
                              envFrom:
                                - secretRef:
                                    name: snucse-pbs
                              volumeMounts:
                                - name: tmp
                                  mountPath: /tmp
                                - name: attachment
                                  mountPath: /data/attachment
                                  readOnly: true
                                - name: uploads
                                  mountPath: /data/user
                                  readOnly: true
                              resources:
                                requests:
                                  cpu: 500m
                                  memory: 2Gi
                                limits:
                                  memory: 2Gi
                              securityContext:
                                runAsUser: 0
                                allowPrivilegeEscalation: false
                                capabilities:
                                  drop:
                                    - ALL
                                seccompProfile:
                                  type: RuntimeDefault
                              args:
                                - backup
                                - --ns=atrium
                                - --backup-id=snucse-files
                                - --backup-type=ct
                                - attachment.pxar:/data/attachment
                                - user.pxar:/data/user
                    YAML
                    kubectl wait --for=condition=complete --timeout=6h job/files-$tag
