---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: snucse
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # needed to prevent permanent diff with ServerSideApply
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  destination:
    name: in-cluster
    namespace: snucse
  syncPolicy:
  #  automated:
  #    prune: true
  #    selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRDs are too large for client-side apply
      - ServerSideApply=true
  sources:
    - repoURL: https://github.com/bacchus-snu/cd-manifests.git
      targetRevision: main
      path: argocd/atrium/snucse
      kustomize: {}
    - repoURL: https://valkey.io/valkey-helm/
      targetRevision: 0.12.0
      chart: valkey
      helm:
        valueFiles:
          - $values/argocd/atrium/snucse/valkey-values.yaml
    - repoURL: https://github.com/bacchus-snu/cd-manifests.git
      targetRevision: main
      ref: values
