---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: snucse-elasticsearch-v9
  labels:
    app.kubernetes.io/name: elasticsearch-v9
    app.kubernetes.io/instance: snucse-elasticsearch-v9
    app.kubernetes.io/part-of: snucse
    app.kubernetes.io/component: search
spec:
  serviceName: snucse-elasticsearch-v9
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch-v9
      app.kubernetes.io/instance: snucse-elasticsearch-v9
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch-v9
        app.kubernetes.io/instance: snucse-elasticsearch-v9
        app.kubernetes.io/part-of: snucse
        app.kubernetes.io/component: search
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: app
          image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: 'false'
            - name: xpack.security.transport.ssl.enabled
              value: 'false'
            - name: ES_JAVA_OPTS
              value: -Xms1g -Xmx1g
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 25
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: '1'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOncePod
        resources:
          requests:
            storage: 10Gi
