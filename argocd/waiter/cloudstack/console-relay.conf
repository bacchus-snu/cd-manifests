# The gateway's own proxy cannot open connections into the guest overlay, so
# this relay (an ordinary pod, whose traffic does reach the overlay) forwards
# the console page and its VNC WebSocket to the console proxy Service.
# CloudStack composes console URLs with port=8080 for the WebSocket; the
# campus firewall only passes 443, so the page is redirected once with
# port=443 and noVNC then opens wss://<host>:443/websockify through the same
# route as the page.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $args $console_args_443 {
    "~^(?<before>.*)port=8080(?<after>.*)$" "${before}port=443${after}";
    default "";
}
server {
    listen 8081;
    location = /resource/noVNC/vnc.html {
        if ($console_args_443 != "") {
            return 302 https://$host$uri?$console_args_443;
        }
        proxy_pass http://console-proxy:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /websockify {
        proxy_pass http://console-proxy:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location / {
        proxy_pass http://console-proxy:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
