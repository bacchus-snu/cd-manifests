# The gateway's own proxy cannot open connections into the guest overlay, so
# this relay (an ordinary pod, whose traffic does reach the overlay) forwards
# the console page and its VNC WebSocket to the console proxy Service.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8081;
    location / {
        proxy_pass http://console-proxy:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 8082;
    location / {
        proxy_pass http://console-proxy:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
