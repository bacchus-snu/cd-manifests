# Templates offered to users, reconciled by sync.py: missing ones are
# registered from the pinned vendor URL (checksum verified by the secondary
# storage VM), public/featured flags are kept in line, and user templates that
# are not listed here are hidden. Nothing is deleted automatically.
#
# A template is immutable once registered, so a refresh is a new entry whose
# name carries the image date; drop the old entry once no instance needs it
# for a reinstall, then delete the old template by hand.
#
# ostype must be an exact `listOsTypes` description; it also picks the virtual
# hardware of new instances. Only names the KVM resource knows as paravirtual
# (Ubuntu, Fedora, CentOS, Red Hat, Debian, Rocky, AlmaLinux, "Other PV") get
# virtio disks and NICs; anything else gets IDE and e1000, which cloud kernels
# (Debian) and RHEL 10 no longer drive. A release newer than the newest listed
# type uses the previous release's type; distributions without one use
# "Other PV (64-bit)". user is the image's default account, which the SSH
# bastion logs in as.
#
# URLs must answer 200 directly: the secondary storage VM does not follow
# redirects, so redirector hosts (download.fedoraproject.org,
# download.opensuse.org, cloud.debian.org, Ubuntu's version-number paths)
# are replaced by the host they redirect to.

