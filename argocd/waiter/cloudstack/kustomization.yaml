resources:
  - resources.yaml
  - management.yaml
  - overlay-gw.yaml
  - console.yaml
  - sync.yaml
  - warpgate.yaml
  # - backup.yaml  # enable once the Proxmox Backup Server is rebuilt (needs secret/cloudstack/pbs)

labels:
  - pairs:
      app.kubernetes.io/name: cloudstack-management
      app.kubernetes.io/instance: cloudstack
    # selectors are written out explicitly: the console proxy Service must stay
    # selector-less because the sync job manages its endpoints
    includeTemplates: true

configMapGenerator:
  - name: cloudstack-sync
    files:
      - sync.py
  - name: warpgate-config
    files:
      - warpgate-config.yaml
  - name: warpgate-nginx
    files:
      - warpgate-nginx.conf
  - name: console-relay
    files:
      - console-relay.conf

images:
  - name: alpine
    newTag: '3.21'
  - name: python
    newTag: 3.13-alpine
  - name: warpgate
    newName: ghcr.io/warp-tech/warpgate
    newTag: 0.28.6
  - name: nginx
    newTag: 1.27-alpine
  - name: cloudstack-management
    newName: ghcr.io/bacchus-snu/cloudstack/management
    newTag: 4.23.0.0
