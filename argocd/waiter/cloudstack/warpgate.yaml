---
# Warpgate: SSH bastion in front of the guests. Users log in with SNUCSE ID
# (SSO, through the web UI link Warpgate prints in the terminal) and reach
# their VMs on the guest overlay; targets, roles and users follow CloudStack
# through the sync job (sync.py).
# keys: admin_password (web admin user, created on first boot), admin_token
# (admin API token for the sync job), oidc_client_secret (client "warpgate" at
# id.snucse.org)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: warpgate
spec:
  vaultAuthRef: default
  type: kv-v2
  mount: secret
  path: cloudstack/warpgate
  destination:
    create: true
    name: warpgate
---
# Warpgate refuses to serve HTTP without a certificate, and the sync job and the
# sidecar verify it by this name
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: warpgate-tls
spec:
  secretName: warpgate-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    algorithm: ECDSA
  dnsNames:
    - login.cloud.snucse.org
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: warpgate-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: warpgate
spec:
  serviceName: warpgate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudstack-management
      app.kubernetes.io/instance: cloudstack
      app.kubernetes.io/component: bastion
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bastion
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      initContainers:
        # first boot: host keys, database and the admin user; every boot: our
        # configuration with the secret filled in
        - name: setup
          image: warpgate # replaced by kustomize
          command:
            - sh
            - -ec
            - |
              if [ ! -f /data/warpgate.yaml ]; then
                warpgate --config /data/warpgate.yaml unattended-setup \
                  --data-path /data --http-port 8888 --ssh-port 2222 \
                  --external-host login.cloud.snucse.org --host-key-verification auto-accept
              fi
              sed "s|\${OIDC_CLIENT_SECRET}|$OIDC_CLIENT_SECRET|" /config/warpgate-config.yaml > /data/warpgate.yaml
              chmod 600 /data/warpgate.yaml
          env:
            - name: WARPGATE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: warpgate
                  key: admin_password
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: warpgate
                  key: oidc_client_secret
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      containers:
        - name: warpgate
          image: warpgate # replaced by kustomize
          args: [--config, /data/warpgate.yaml, run, --enable-admin-token]
          env:
            - name: WARPGATE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: warpgate
                  key: admin_token
          ports:
            - name: ssh
              containerPort: 2222
            - name: https
              containerPort: 8888
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
        # plain HTTP for the gateway, re-encrypted to Warpgate on the loopback
        - name: proxy
          image: nginx # replaced by kustomize
          ports:
            - name: web
              containerPort: 8080
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: warpgate-data
        - name: config
          configMap:
            name: warpgate-config
        - name: tls
          secret:
            secretName: warpgate-tls
        - name: nginx
          configMap:
            name: warpgate-nginx
            items:
              - key: warpgate-nginx.conf
                path: default.conf
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
# web UI and admin API: "web" for the gateway (plain HTTP via the sidecar),
# "https" for the sync job (Warpgate's own TLS)
apiVersion: v1
kind: Service
metadata:
  name: warpgate
spec:
  selector:
    app.kubernetes.io/name: cloudstack-management
    app.kubernetes.io/instance: cloudstack
    app.kubernetes.io/component: bastion
  ports:
    - name: web
      port: 8080
      targetPort: web
    - name: https
      port: 8888
      targetPort: https
---
# SSH entry point: kerkoporta forwards WAN 2222 here. Clients must keep their
# own address: Warpgate's login protection blocks by source IP, and with the
# cluster-wide policy every client shares the node's address, so Internet
# scanners get everyone blocked.
apiVersion: v1
kind: Service
metadata:
  name: warpgate-ssh
  annotations:
    lbipam.cilium.io/ips: 10.89.0.36
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: cloudstack-management
    app.kubernetes.io/instance: cloudstack
    app.kubernetes.io/component: bastion
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: warpgate
spec:
  parentRefs:
    - namespace: cilium-system
      name: web-gateway
      sectionName: https-cloud-snucse-org
  hostnames:
    - login.cloud.snucse.org
  rules:
    - backendRefs:
        - name: warpgate
          port: 8080
