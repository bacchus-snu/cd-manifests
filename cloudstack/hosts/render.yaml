# Renders the per-host files locally into out/<host>/ for review or manual
# application, without connecting to the hosts, and writes the host lists that
# the atrium side keeps (overlay gateway peers, node firewall) from the inventory.
# Each host's partition is rendered from its captured topology in tests/fixtures;
# on the host, site.yaml renders it from the live one.
#
#   ansible-playbook -i inventory.yaml render.yaml
---
- name: Render host files
  hosts: cloudstack_hosts
  connection: local
  gather_facts: false
  vars:
    out: '{{ playbook_dir }}/out/{{ inventory_hostname }}'
    # the inventory's become settings are for the hosts, not this machine
    # (and the password lookup must not run at all)
    ansible_become: false
    ansible_become_password: ''
    sysfs_fixtures:
      derby: sysfs-i7
      eggnog: sysfs-eggnog
      faust: sysfs-faust
      cojito: sysfs-cojito
      jackdaniels: sysfs-jackdaniels
      jimbeam: sysfs-jimbeam
    sysfs_fixture: '{{ playbook_dir }}/tests/fixtures/{{ sysfs_fixtures[inventory_hostname] }}'
    partition_rendered: '{{ partition_values.stdout | from_json }}'
    partition_kernel_args: '{{ partition_rendered.kernel_args }}'
  tasks:
    - ansible.builtin.file:
        path: '{{ out }}'
        state: directory
    - ansible.builtin.template:
        src: templates/interfaces.j2
        dest: '{{ out }}/interfaces'
    - ansible.builtin.template:
        src: templates/keepalived.conf.j2
        dest: '{{ out }}/keepalived.conf'
      when: inventory_hostname in groups['cloudstack_gateway']
    - ansible.builtin.template:
        src: templates/nftables-host.nft.j2
        dest: '{{ out }}/nftables-host.nft'
    - ansible.builtin.template:
        src: templates/nftables-gateway.nft.j2
        dest: '{{ out }}/nftables-gateway.nft'
      when: inventory_hostname in groups['cloudstack_gateway']

    - name: Partition from the captured topology
      ansible.builtin.command:
        argv:
          - '{{ playbook_dir }}/files/partition-render'
          - --sysfs
          - '{{ sysfs_fixture }}/sys'
          - --proc
          - '{{ sysfs_fixture }}/proc'
          - --declared
          - '{{ partition_declared | to_json }}'
          - --catalog
          - '{{ playbook_dir }}/../../argocd/atrium/cloudstack/compute-catalog.json'
          - --out
          - '{{ out }}/partition.json'
          - --agent-values
          - --kernel-args
      environment:
        PYTHONDONTWRITEBYTECODE: '1'
      register: partition_values
      changed_when: partition_rendered.changed
    - ansible.builtin.template:
        src: templates/grub-partition.cfg.j2
        dest: '{{ out }}/90-partition.cfg'
    - name: Agent values of the partition
      ansible.builtin.copy:
        dest: '{{ out }}/agent-partition.properties'
        content: "{% for k, v in partition_rendered.agent_values.items() %}{{ k }}={{ v }}\n{% endfor %}"

    - name: Overlay gateway peers
      ansible.builtin.copy:
        dest: '{{ playbook_dir }}/../../argocd/atrium/cloudstack/overlay-gw/peers'
        content: "{{ groups['cloudstack_hosts'] | map('extract', hostvars, 'campus_ip') | join('\n') }}\n"
      run_once: true

    - name: Atrium node firewall admits VXLAN from the hosts only
      ansible.builtin.replace:
        path: '{{ playbook_dir }}/../../nodes/atrium/k8s-host-firewall.nft'
        regexp: '(set cloudstack_peers [{]\n    type ipv4_addr\n    elements = [{])[^}]*([}])'
        replace: '\1 {{ groups["cloudstack_hosts"] | map("extract", hostvars, "campus_ip") | join(", ") }} \2'
      run_once: true
