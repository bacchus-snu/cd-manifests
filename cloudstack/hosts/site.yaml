# Configures Debian 13 KVM hosts for CloudStack: packages from repo.snucse.org,
# the VXLAN overlays, GPU passthrough binding, the host partition (housekeeping
# cores, GPU units and CPU pool) and its hooks, agent settings, guest gateway
# (VRRP + NAT) and NFS secondary storage. Network, GPU binding and kernel
# argument changes are written to files only and take effect on the next
# reboot; the playbook never restarts networking or reboots itself.
#
#   ./apply.sh <commit> [--limit derby]     (or, from a checkout:)
#   ansible-playbook -i inventory.yaml site.yaml [--limit derby]
---
- name: CloudStack KVM hosts
  hosts: cloudstack_hosts
  # a restart that a later failure would otherwise drop still happens
  force_handlers: true
  vars:
    # GPU types: PCI ids, unit sizes and interconnect classes
    compute_catalog: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../argocd/atrium/cloudstack/compute-catalog.json') | from_json }}"
    partition_modules: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/files/partition/*.py') | map('basename') | sort }}"
    partition_rendered: '{{ partition_values.stdout | from_json }}'
    partition_kernel_args: '{{ partition_rendered.kernel_args }}'
    partition_housekeeping: "{{ partition_rendered.partition.housekeeping | join(',') }}"
  tasks:
    - name: Bacchus apt keyring
      ansible.builtin.get_url:
        url: '{{ apt_keyring_url }}'
        dest: /usr/share/keyrings/bacchus-archive-keyring.gpg
        mode: '0644'

    - name: Bacchus apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/bacchus.list
        content: "deb [signed-by=/usr/share/keyrings/bacchus-archive-keyring.gpg] {{ apt_repo }} trixie main\n"
        mode: '0644'

    # The agent needs Java 17, which Debian 13 does not ship; Adoptium's
    # Temurin 17 is pinned by name in Packages below.
    - name: Adoptium apt keyring
      ansible.builtin.get_url:
        url: https://packages.adoptium.net/artifactory/api/gpg/key/public
        dest: /usr/share/keyrings/adoptium.asc
        mode: '0644'

    - name: Adoptium apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/adoptium.list
        content: "deb [signed-by=/usr/share/keyrings/adoptium.asc] https://packages.adoptium.net/artifactory/deb trixie main\n"
        mode: '0644'

    # keys in trusted.gpg.d are trusted for every repository; each repository
    # above names its own key instead
    - name: Upstream CloudStack repository, globally trusted keys and SHA-1 policy override are gone
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - /etc/apt/sources.list.d/cloudstack.list
        - /etc/apt/trusted.gpg.d/cloudstack.asc
        - /etc/apt/trusted.gpg.d/adoptium.gpg
        - /etc/crypto-policies/back-ends/apt-sequoia.config

    - name: python3-apt for the apt module (installed even in check mode)
      ansible.builtin.command: apt-get install -y python3-apt
      args:
        creates: /usr/lib/python3/dist-packages/apt
      check_mode: false

    - name: Packages
      ansible.builtin.apt:
        update_cache: true
        # the hold below keeps apt from moving them; a new cloudstack_version moves them here
        allow_change_held_packages: true
        name:
          - bridge-utils
          - chrony
          - nftables
          # the management server prefixes every command it runs over SSH with sudo,
          # even when logged in as root; minimal Debian installs lack it
          - sudo
          - temurin-17-jre
          # GPU discovery (gpudiscovery.sh) shells out to lspci and xmlstarlet,
          # which the agent package does not depend on
          - pciutils
          - xmlstarlet
          - cloudstack-common={{ cloudstack_version }}
          - cloudstack-agent={{ cloudstack_version }}

    - name: Hold CloudStack packages at the pinned version
      ansible.builtin.dpkg_selections:
        name: '{{ item }}'
        selection: hold
      loop:
        - cloudstack-common
        - cloudstack-agent

    # The agent's GPU discovery script only reports PCI classes "3D controller",
    # "Processing accelerators" and "Display controller"; GPUs with a display
    # output enumerate as "VGA compatible controller" and are silently skipped
    # although the script's own sample output shows such a card (4.23.0.0
    # scripts/vm/hypervisor/kvm/gpudiscovery.sh). Every board also has a VGA
    # device of its own (BMC or onboard graphics), so a VGA-class device is
    # reported only while bound to vfio-pci, that is, reserved for passthrough
    # by the binding below. The package overwrites the script on upgrade, so
    # this is re-applied after every version change; the pattern also matches
    # the line as the plain class-list edit left it.
    - name: GPU discovery also reports VGA-class GPUs reserved for passthrough
      ansible.builtin.replace:
        path: /usr/share/cloudstack-common/scripts/vm/hypervisor/kvm/gpudiscovery.sh
        regexp: '\((?:VGA\\ compatible\\ controller\|)?3D\\ controller\|Processing\\ accelerators\|Display\\ controller\) \]\]; then$'
        replace: |-
          (3D\\ controller|Processing\\ accelerators|Display\\ controller) ]] &&
          	   ! [[ "$PCI_CLASS" =~ ^VGA\\ compatible\\ controller && "$(basename "$(readlink "/sys/bus/pci/devices/$SYSFS_ADDR/driver" 2>/dev/null)")" == vfio-pci ]]; then
      notify: restart cloudstack-agent

    - name: libvirt host certificate, installed when CloudStack adds the host
      ansible.builtin.stat:
        path: /etc/pki/libvirt/servercert.pem
      register: libvirt_cert

    # The agent calls a host secured, and migrates over qemu+tls, only if
    # libvirtd answers TLS on 16514. cloudstack-setup-agent masks libvirt's
    # socket units and asks for the listener through libvirtd_opts, which
    # Debian's unit does not read (it passes $LIBVIRTD_ARGS). Without its
    # certificate libvirtd cannot listen on TLS and does not start, so a host
    # CloudStack has not added yet keeps Debian's default; the first run after
    # it has been added turns the listener on.
    - name: libvirtd opens its own listeners
      ansible.builtin.lineinfile:
        path: /etc/default/libvirtd
        regexp: '^#?LIBVIRTD_ARGS='
        line: "{{ 'LIBVIRTD_ARGS=\"--listen\"' if libvirt_cert.stat.exists else '#LIBVIRTD_ARGS=\"--timeout 120\"' }}"
      notify: [restart libvirtd, restart cloudstack-agent]

    # The CA that signs the hosts' certificates signs the system VMs' too:
    # only the hosts may drive libvirt, and only over the management overlay.
    - name: libvirtd TLS listener scope
      ansible.builtin.lineinfile:
        path: /etc/libvirt/libvirtd.conf
        regexp: '^#?\s*{{ item.key }}\s*='
        line: '{{ item.key }} = {{ item.value }}'
      loop:
        - { key: listen_addr, value: '"{{ mgmt_ip }}"' }
        - key: tls_allowed_dn_list
          value: >-
            {{ groups['cloudstack_hosts'] | map('extract', hostvars, 'ansible_host')
               | map('regex_replace', '^(.*)$', 'CN=\1,OU=cloudstack,O=cloudstack,C=cloudstack')
               | sort | to_json }}
      notify: [restart libvirtd, restart cloudstack-agent]

    # Boards shipped without a programmed SMBIOS UUID all report the same
    # placeholder, and libvirt refuses to migrate between hosts whose UUIDs
    # match ("Attempt to migrate guest to the same host").
    - name: libvirt host UUID from the machine id
      ansible.builtin.lineinfile:
        path: /etc/libvirt/libvirtd.conf
        regexp: '^#?\s*host_uuid_source\s*='
        line: 'host_uuid_source = "machine-id"'
      notify: [restart libvirtd, restart cloudstack-agent]

    - name: libvirtd running
      ansible.builtin.service:
        name: libvirtd
        state: started
      # in check mode the package above is not really installed yet
      ignore_errors: '{{ ansible_check_mode }}'

    # GPUs, with their companion functions (the pci_ids of gpu_type in the
    # catalog), are claimed by vfio-pci at boot for passthrough; the softdeps
    # load vfio-pci before the drivers that would otherwise take them
    - name: GPU passthrough binding (takes effect on reboot)
      ansible.builtin.copy:
        dest: '{{ item.dest }}'
        content: '{{ item.content }}'
        mode: '0644'
      loop:
        - dest: /etc/modprobe.d/vfio.conf
          content: |
            options vfio-pci ids={{ (compute_catalog.gpu_types | selectattr('tag', '==', gpu_type) | first).pci_ids | join(',') }}
            softdep nouveau pre: vfio-pci
            softdep snd_hda_intel pre: vfio-pci
        - dest: /etc/modprobe.d/blacklist-nouveau.conf
          content: |
            blacklist nouveau
            options nouveau modeset=0
        - dest: /etc/modules-load.d/vfio.conf
          content: |
            vfio
            vfio_iommu_type1
            vfio_pci
      loop_control:
        label: '{{ item.dest }}'
      when: gpu_type | default('', true) | length > 0
      register: vfio

    # The initramfs carries the modprobe configuration of early-loaded
    # drivers. update-initramfs -u -k all rebuilds the image of every
    # installed kernel that has one; it runs while one of those is older than
    # that configuration, so a run that stopped before rebuilding is
    # completed by the next one.
    - name: GPU passthrough configuration files
      ansible.builtin.stat:
        path: '{{ item }}'
      loop: [/etc/modprobe.d/vfio.conf, /etc/modprobe.d/blacklist-nouveau.conf, /etc/modules-load.d/vfio.conf]
      register: vfio_files
      when: gpu_type | default('', true) | length > 0

    - name: Installed kernels
      ansible.builtin.command: linux-version list
      register: initramfs_kernels
      changed_when: false
      check_mode: false
      when: gpu_type | default('', true) | length > 0

    - name: Initramfs images
      ansible.builtin.stat:
        path: /boot/initrd.img-{{ item }}
      loop: '{{ initramfs_kernels.stdout_lines | default([]) }}'
      register: initramfs_images
      when: gpu_type | default('', true) | length > 0

    - name: Initramfs carries the GPU passthrough binding
      ansible.builtin.command: update-initramfs -u -k all
      when: >-
        gpu_type | default('', true) | length > 0 and (
          vfio is changed
          or initramfs_images.results | selectattr('stat.exists') | map(attribute='stat.mtime')
             | select('lt', vfio_files.results | map(attribute='stat.mtime') | max) | list | length > 0)

    # The agent's certificate is issued to `hostname --fqdn`, and libvirt
    # admits TLS peers (migration) only by the names in tls_allowed_dn_list.
    - name: Host name resolves to its campus FQDN
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '{{ item.regexp }}'
        line: '{{ item.line }}'
      loop:
        - { regexp: '^127\.0\.0\.1\s', line: "127.0.0.1\tlocalhost" }
        - { regexp: '^{{ campus_ip | regex_escape }}\s', line: "{{ campus_ip }}\t{{ ansible_host }}\t{{ inventory_hostname }}" }

    - name: Host FQDN
      ansible.builtin.command: hostname --fqdn
      register: fqdn
      changed_when: false
      check_mode: false

    - name: Host FQDN check
      ansible.builtin.assert:
        that: fqdn.stdout == ansible_host
        fail_msg: 'hostname --fqdn is {{ fqdn.stdout }}, not {{ ansible_host }}'
      when: not ansible_check_mode

    # On hosts people reach through a sudo user, root stays closed to them; the
    # management server still adds a KVM host by logging in as root with its
    # key, and its connections arrive from the overlay gateway's address.
    # A Match block in an included file ends with that file.
    - name: Root login only for the management server, by key
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/cloudstack-root.conf
        content: |
          PermitRootLogin no
          Match Address {{ management_server }}
              PermitRootLogin prohibit-password
        mode: '0644'
        validate: sshd -t -f %s
      when: inventory_hostname in groups['bacchus_login']
      notify: reload ssh

    - name: Root login as sshd resolves it, from the management server and from the campus
      ansible.builtin.command: sshd -T -C user=root,addr={{ item }},host=probe,laddr={{ mgmt_ip }},lport=22
      loop: ['{{ management_server }}', '{{ campus_gateway }}']
      register: root_login
      changed_when: false
      check_mode: false
      when: inventory_hostname in groups['bacchus_login']

    - name: Root login check
      ansible.builtin.assert:
        that:
          - root_login.results[0].stdout is search('(?m)^permitrootlogin without-password$')
          - root_login.results[1].stdout is search('(?m)^permitrootlogin no$')
      when: inventory_hostname in groups['bacchus_login'] and not ansible_check_mode

    - name: IP forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-cloudstack.conf
        content: "net.ipv4.ip_forward = 1\n"
        mode: '0644'
      notify: apply sysctl

    - name: Network interfaces (takes effect on reboot)
      ansible.builtin.template:
        src: templates/interfaces.j2
        dest: /etc/network/interfaces
        mode: '0644'
        backup: true
      register: interfaces

    - name: nftables directory
      ansible.builtin.file:
        path: /etc/nftables.d
        state: directory
        mode: '0755'

    - name: nftables loads the tables in /etc/nftables.d
      ansible.builtin.template:
        src: templates/nftables.conf.j2
        dest: /etc/nftables.conf
        mode: '0755'
        backup: true
      notify: reload nftables

    - name: Host input firewall
      ansible.builtin.template:
        src: templates/nftables-host.nft.j2
        dest: /etc/nftables.d/host.nft
        mode: '0644'
        validate: nft -c -f %s
      notify: reload nftables

    - name: nftables enabled
      ansible.builtin.service:
        name: nftables
        enabled: true
      # in check mode the package above is not really installed yet
      ignore_errors: '{{ ansible_check_mode }}'

    # The host partition: the housekeeping cores H, one GPU unit (whole cores
    # and 1 GiB pages of the GPU's NUMA node) per GPU position, and the CPU
    # pool. The library goes in first: the renderer and both hooks import it.
    - name: Partition library directory
      ansible.builtin.file:
        path: /usr/local/lib/cloudstack-partition/partition
        state: directory
        mode: '0755'
      register: partition_library_dir

    - name: Partition library
      ansible.builtin.copy:
        src: files/partition/{{ item }}
        dest: /usr/local/lib/cloudstack-partition/partition/
        mode: '0644'
      loop: '{{ partition_modules }}'
      register: partition_library

    # in check mode a directory that would be created holds nothing to remove
    - name: Partition library modules installed
      ansible.builtin.find:
        paths: /usr/local/lib/cloudstack-partition/partition
        patterns: '*.py'
      register: partition_library_installed
      when: not (ansible_check_mode and partition_library_dir is changed)

    - name: Partition library keeps no module the repository no longer has
      ansible.builtin.file:
        path: /usr/local/lib/cloudstack-partition/partition/{{ item }}
        state: absent
      loop: "{{ partition_library_installed.files | default([]) | map(attribute='path') | map('basename') | difference(partition_modules) }}"
      register: partition_library_pruned

    - name: Partition renderer
      ansible.builtin.copy:
        src: files/partition-render
        dest: /usr/local/sbin/partition-render
        mode: '0755'
      register: partition_renderer

    # Only reads the host. In check mode it runs only when the copies above
    # are current, so that what it prints is what a real run would apply;
    # otherwise it and everything derived from it are skipped.
    - name: Partition of this host
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/partition-render
          - --declared
          - '{{ partition_declared | to_json }}'
          - --catalog
          - '{{ compute_catalog | to_json }}'
          - --agent-values
          - --kernel-args
      register: partition_values
      changed_when: false
      check_mode: false
      when: >-
        not (ansible_check_mode and (partition_library is changed or partition_library_pruned is changed
                                     or partition_renderer is changed))

    - name: Partition this run would write (check mode)
      ansible.builtin.debug:
        var: partition_rendered
      when: ansible_check_mode and partition_values is not skipped

    # read by both hooks at every domain start; rewritten only when it changes
    - name: Partition file
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/partition-render
          - --declared
          - '{{ partition_declared | to_json }}'
          - --catalog
          - '{{ compute_catalog | to_json }}'
          - --out
          - /etc/cloudstack/agent/partition.json
      register: partition_file
      changed_when: (partition_file.stdout | from_json).changed
      when: not ansible_check_mode

    - name: Current partition file (check mode)
      ansible.builtin.slurp:
        src: /etc/cloudstack/agent/partition.json
      register: partition_current
      failed_when: false
      when: ansible_check_mode and partition_values is not skipped

    - name: Partition changed
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: /etc/cloudstack/agent/partition.json
          {{ 'would change' if ansible_check_mode else 'changed' }}; the management server
          learns it from cloudstack/tools/cs_partition.py register-groups {{ inventory_hostname }}
      when: >-
        (partition_values is not skipped
         and (partition_current.content is not defined
              or (partition_current.content | b64decode | from_json) != partition_rendered.partition))
        if ansible_check_mode else partition_file is changed

    - name: GRUB configuration directory
      ansible.builtin.file:
        path: /etc/default/grub.d
        state: directory
        mode: '0755'

    - name: Partition kernel arguments (take effect on reboot)
      ansible.builtin.template:
        src: templates/grub-partition.cfg.j2
        dest: /etc/default/grub.d/90-partition.cfg
        mode: '0644'
        validate: sh -n %s
      register: partition_grub
      when: partition_values is not skipped

    - name: GRUB configuration and the partition's drop-in
      ansible.builtin.stat:
        path: '{{ item }}'
      loop: [/boot/grub/grub.cfg, /etc/default/grub.d/90-partition.cfg]
      register: partition_grub_files

    # Regenerated while grub.cfg is older than the drop-in, so a run that
    # stopped before regenerating it, or whose update-grub failed, is
    # completed by the next one.
    - name: GRUB configuration carries the partition kernel arguments
      ansible.builtin.command: update-grub
      when: >-
        partition_grub is changed
        or not partition_grub_files.results[0].stat.exists
        or (partition_grub_files.results[1].stat.exists
            and partition_grub_files.results[0].stat.mtime < partition_grub_files.results[1].stat.mtime)

    - name: 1 GiB hugepage mount unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/dev-hugepages1G.mount
        content: |
          # Managed by cd-manifests/cloudstack/hosts (Ansible). Do not edit by hand.
          # libvirt backs GPU VMs' memory with these pages and does not start
          # while this is not mounted, so it is mounted before sysinit.target,
          # like the stock /dev/hugepages.
          [Unit]
          Description=Huge Pages File System (1 GiB pages)
          DefaultDependencies=no
          Before=sysinit.target

          [Mount]
          What=hugetlbfs
          Where=/dev/hugepages1G
          Type=hugetlbfs
          Options=pagesize=1G,nosuid,nodev

          [Install]
          WantedBy=sysinit.target
        mode: '0644'
      register: partition_mount_unit

    - name: Drop-in directories of the host's own units
      ansible.builtin.file:
        path: /etc/systemd/system/{{ item }}.d
        state: directory
        mode: '0755'
      loop: [system.slice, user.slice, init.scope, volumetransfer.slice]

    # The host's own processes run on H, and so do the agent's volume
    # transfers (volumetransfer.slice, shipped by the agent package; the agent
    # refuses a transfer while that slice may use other CPUs than system.slice).
    # Guests live in machine.slice, and libvirt pins each one to its cores.
    - name: Host processes confined to the housekeeping cores
      ansible.builtin.copy:
        dest: /etc/systemd/system/{{ item.unit }}.d/50-housekeeping.conf
        content: |
          # Managed by cd-manifests/cloudstack/hosts (Ansible). Do not edit by hand.
          [{{ item.section }}]
          AllowedCPUs={{ partition_housekeeping }}
        mode: '0644'
      loop:
        - { unit: system.slice, section: Slice }
        - { unit: user.slice, section: Slice }
        - { unit: init.scope, section: Scope }
        - { unit: volumetransfer.slice, section: Slice }
      loop_control:
        label: '{{ item.unit }}'
      register: partition_slices
      when: partition_values is not skipped

    - name: Units systemd has not reloaded since they changed on disk
      ansible.builtin.command: systemctl show system.slice user.slice init.scope volumetransfer.slice dev-hugepages1G.mount -p NeedDaemonReload
      register: partition_units_state
      changed_when: false
      check_mode: false

    # also applies the confinement above to the running slices
    - name: systemd reloads the units above
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: >-
        partition_mount_unit is changed or partition_slices is changed
        or 'NeedDaemonReload=yes' in partition_units_state.stdout_lines

    - name: 1 GiB hugepage mount
      ansible.builtin.systemd_service:
        name: dev-hugepages1G.mount
        enabled: true
        state: started
      # in check mode the unit file above is not really written yet
      ignore_errors: '{{ ansible_check_mode }}'

    - name: Housekeeping CPUs of the host's own units, as systemd applies them
      ansible.builtin.command: systemctl show system.slice user.slice init.scope volumetransfer.slice -p AllowedCPUs
      register: partition_allowed_cpus
      changed_when: false
      when: partition_values is not skipped and not ansible_check_mode

    # systemd prints each unit's set as space-separated ranges ("62-63 126-127")
    - name: Housekeeping CPUs check
      ansible.builtin.assert:
        that: partition_allowed_sets == [partition_housekeeping_set] * 4
        fail_msg: >-
          AllowedCPUs of system.slice, user.slice, init.scope and volumetransfer.slice are {{ partition_allowed_sets }},
          not the housekeeping cores {{ partition_housekeeping_set }}
      vars:
        partition_housekeeping_set: "{{ partition_rendered.partition.housekeeping | sort | join(',') }}"
        partition_allowed_sets: >-
          {%- set ns = namespace(sets=[]) -%}
          {%- for line in partition_allowed_cpus.stdout_lines if line.startswith('AllowedCPUs=') -%}
          {%- set cpus = namespace(list=[]) -%}
          {%- for r in line[12:].replace(',', ' ').split() -%}
          {%- set ends = r.split('-') -%}
          {%- set cpus.list = cpus.list + range(ends[0] | int, ends[-1] | int + 1) | list -%}
          {%- endfor -%}
          {%- set ns.sets = ns.sets + [cpus.list | sort | join(',')] -%}
          {%- endfor -%}
          {{ ns.sets }}
      when: partition_allowed_cpus is not skipped

    # libvirt does not start while a path named here is not a hugetlbfs
    # mount, so this follows the mount above
    - name: libvirt takes guest hugepages from the 1 GiB mount
      ansible.builtin.lineinfile:
        path: /etc/libvirt/qemu.conf
        regexp: '^#?\s*hugetlbfs_mount\s*='
        line: 'hugetlbfs_mount = "/dev/hugepages1G"'
      notify: restart libvirtd

    - name: libvirt hook directory
      ansible.builtin.file:
        path: /etc/libvirt/hooks
        state: directory
        mode: '0755'

    # Admits each domain into the partition when it starts (fail closed) and
    # refuses incoming live migration; see the file. libvirt looks for hook
    # scripts when the daemon starts. The hook's ledger knows only the
    # domains it admitted, so it goes on a host without running guests.
    - name: libvirt qemu hook
      ansible.builtin.copy:
        src: files/libvirt-qemu-hook
        dest: /etc/libvirt/hooks/qemu
        mode: '0755'
      register: partition_hook
      notify: restart libvirtd

    - name: Partition hook installed
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: from the libvirtd restart at the end of this run, the
          libvirt hook admits every domain start into the partition. Guests that were
          already running are neither in its ledger nor pinned to the partition, so they
          share cores and GPUs with the guests it admits: stop them.
      when: partition_hook.changed

    - name: Agent hook directory
      ansible.builtin.file:
        path: /etc/cloudstack/agent/hooks
        state: directory
        mode: '0755'

    # read by the agent at every VM start; see the file for what it changes
    - name: Agent domain XML hook
      ansible.builtin.copy:
        src: files/libvirt-vm-xml-transformer.py
        dest: /etc/cloudstack/agent/hooks/libvirt-vm-xml-transformer.py
        mode: '0755'

    - name: Agent settings
      ansible.builtin.lineinfile:
        path: /etc/cloudstack/agent/agent.properties
        regexp: '^#?{{ item.key }}='
        line: '{{ item.key }}={{ item.value }}'
      loop: '{{ agent_settings + (partition_agent_settings if partition_agent_values | bool else []) }}'
      vars:
        agent_settings:
          # once connected, the agent rewrites this line as "<servers>@<lb algorithm>"
          # from the management server's list; write the same form so runs stay idempotent
          - { key: host, value: '{{ management_server }}@static' }
          - { key: private.network.device, value: '{{ overlays.mgmt.bridge }}' }
          # a security-group zone has no Public traffic, but the agent refuses to
          # start unless the device exists; the guest bridge keeps a stray Public
          # NIC off the campus
          - { key: public.network.device, value: '{{ overlays.guest.bridge }}' }
          - { key: guest.network.device, value: '{{ overlays.guest.bridge }}' }
          # VMs never live-migrate, so each one sees its host's CPU as it is
          - { key: guest.cpu.mode, value: host-passthrough }
          - { key: agent.hooks.libvirt_vm_xml_transformer.shell_script, value: libvirt-vm-xml-transformer.py }
        # host.reserved.cpu.count, host.reserved.mem.mb and host.tags of the partition
        partition_agent_settings: "{{ [] if partition_values is skipped else partition_rendered.agent_values | dict2items }}"
      # the file also holds the keystore passphrase, which a diff would print
      diff: false
      notify: restart cloudstack-agent

    - name: Agent names no guest CPU model
      ansible.builtin.lineinfile:
        path: /etc/cloudstack/agent/agent.properties
        regexp: '^guest\.cpu\.model='
        state: absent
      diff: false
      notify: restart cloudstack-agent

    - name: Kernel command line of the running boot
      ansible.builtin.slurp:
        src: /proc/cmdline
      register: proc_cmdline

    - name: Reboot needed
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: reboot to apply
          {{ ((['/etc/network/interfaces (previous file kept as backup)'] if interfaces is changed else [])
              + (['the GPU passthrough binding'] if vfio is changed else [])
              + (['the kernel arguments "' ~ partition_kernel_args ~ '"'] if partition_args_pending else [])) | join(' and ') }}
      vars:
        # the running kernel lacks one of the partition's arguments
        partition_args_pending: >-
          {{ partition_values is not skipped
             and partition_kernel_args.split() | difference((proc_cmdline.content | b64decode).split()) | length > 0 }}
      when: interfaces is changed or vfio is changed or partition_args_pending

  handlers:
    - name: apply sysctl
      ansible.builtin.command: sysctl --system
    - name: reload ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded
    # running guests are untouched; listed before the agent, which reports
    # whether the host is secured when it connects
    - name: restart libvirtd
      ansible.builtin.service:
        name: libvirtd
        state: restarted
    - name: restart cloudstack-agent
      ansible.builtin.service:
        name: cloudstack-agent
        state: restarted
    # never restarted: stopping the unit flushes the whole ruleset, the agent's
    # security group tables included
    - name: reload nftables
      ansible.builtin.service:
        name: nftables
        state: reloaded

- name: Guest overlay gateways (VRRP + NAT + resolver)
  hosts: cloudstack_gateway
  tasks:
    # guests get the gateway address as their DNS server: it forwards every
    # query and knows no names itself, so instance names stay private.
    # Written before the package is installed so the service never starts
    # with the stock listen-everywhere configuration.
    - name: Guest resolver directory
      ansible.builtin.file:
        path: /etc/dnsmasq.d
        state: directory
        mode: '0755'

    - name: Guest resolver configuration
      ansible.builtin.template:
        src: templates/dnsmasq-guest.conf.j2
        dest: /etc/dnsmasq.d/cloudstack-guest.conf
        mode: '0644'
      notify: restart dnsmasq

    - name: Packages
      ansible.builtin.apt:
        name:
          - keepalived
          - nftables
          - dnsmasq

    - name: keepalived configuration
      ansible.builtin.template:
        src: templates/keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        mode: '0644'
      notify: restart keepalived

    - name: Gateway nftables table
      ansible.builtin.template:
        src: templates/nftables-gateway.nft.j2
        dest: /etc/nftables.d/gateway.nft
        mode: '0644'
        validate: nft -c -f %s
      notify: reload nftables

    - name: Services enabled
      ansible.builtin.service:
        name: '{{ item }}'
        enabled: true
      loop:
        - keepalived
        - dnsmasq
      # in check mode the packages above are not really installed yet
      ignore_errors: '{{ ansible_check_mode }}'

  handlers:
    # the overlay bridge only exists after the reboot that applies the network
    # files; until then keepalived cannot start and boots on its own later
    - name: restart keepalived
      ansible.builtin.service:
        name: keepalived
        state: restarted
      when: overlays.guest.overlay_bridge in ansible_facts['interfaces']
    # never restarted: stopping the unit flushes the whole ruleset, the agent's
    # security group tables included
    - name: reload nftables
      ansible.builtin.service:
        name: nftables
        state: reloaded
    - name: restart dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        state: restarted
      # in check mode the package is not really installed yet
      ignore_errors: '{{ ansible_check_mode }}'

- name: NFS secondary storage
  hosts: cloudstack_secondary_storage
  tasks:
    - name: Packages
      ansible.builtin.apt:
        name: nfs-kernel-server

    - name: Export directory
      ansible.builtin.file:
        path: /srv/secondary
        state: directory
        mode: '0755'

    - name: Exports (management overlay only; CloudStack needs no_root_squash)
      ansible.builtin.copy:
        dest: /etc/exports
        content: "/srv/secondary {{ overlays.mgmt.network }}(rw,sync,no_subtree_check,no_root_squash)\n"
        mode: '0644'
      notify: reexport

    - name: Service enabled
      ansible.builtin.service:
        name: nfs-kernel-server
        enabled: true
        state: started

  handlers:
    - name: reexport
      ansible.builtin.command: exportfs -ra

# Any other host serves no NFS. The export directory is left for the operator
# to remove once its store is gone; nfs-common stays, as the agent mounts the
# secondary storage through it.
- name: No NFS server outside the secondary storage host
  hosts: cloudstack_hosts:!cloudstack_secondary_storage
  tasks:
    - name: NFS server removed
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: absent
        purge: true
